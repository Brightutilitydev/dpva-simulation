<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pathguard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
.log-pane { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.5; }
.log-pane .entry { padding: 2px 4px; border-bottom: 1px solid #eee; }
.topo-preview { font-size: 13px; }
.node-badge { cursor: default; }
#packet-log { max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
#packet-log div { padding: 1px 4px; border-bottom: 1px solid #f0f0f0; }
.pkt-drop { background: #fff0f0; }
.pkt-inject { background: #fffde7; }
.pkt-ok { background: #f5f5f5; }
</style>
</head>
<body>

<nav class="navbar navbar-light bg-light border-bottom px-3 py-2">
  <span class="navbar-brand fw-bold" style="font-size:18px;">pathguard</span>
  <span class="text-secondary" style="font-size:13px;">dynamic path verification — simulation tool</span>
  <span class="ms-auto small text-secondary" id="status-badge">idle</span>
</nav>

<div class="container-fluid py-3">
  <div class="row g-3">

    <!-- ─── left: controls ─── -->
    <div class="col-3">
      <div class="card">
        <div class="card-body p-3">
          <div class="small text-uppercase text-secondary mb-2" style="font-size:11px;">Topology</div>
          <select class="form-select form-select-sm mb-2" id="topo-select" onchange="updateTopoInfo()">
            <option value="simple">Simple (5 nodes)</option>
            <option value="mesh">Mesh (6 nodes)</option>
            <option value="diamond">Diamond (5 nodes)</option>
            <option value="long">Long (8 nodes)</option>
          </select>
          <div id="topo-info" class="topo-preview text-secondary small"></div>

          <hr class="my-3">

          <div class="small text-uppercase text-secondary mb-2" style="font-size:11px;">Attack</div>
          <select class="form-select form-select-sm mb-2" id="attack-select">
            <option value="none">None (normal)</option>
            <option value="hijack">BGP hijack</option>
            <option value="mitm">Man-in-the-middle</option>
            <option value="injection">Packet injection</option>
            <option value="drop">Packet drop</option>
            <option value="replay">Replay attack</option>
          </select>

          <div class="mb-2">
            <label class="small text-secondary">Malicious node</label>
            <select class="form-select form-select-sm" id="mal-node">
              <option value="2">Node 2</option>
              <option value="3">Node 3</option>
              <option value="4" selected>Node 4</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="small text-secondary">Packets</label>
            <input class="form-control form-control-sm" type="number" id="pkt-count" value="50" min="5" max="500">
          </div>

          <button class="btn btn-dark btn-sm w-100 mt-2" onclick="runSim()">Run</button>

          <hr class="my-3">

          <div class="small text-uppercase text-secondary mb-2" style="font-size:11px;">Bulk test</div>
          <button class="btn btn-outline-secondary btn-sm w-100" onclick="runBulk()">Run all scenarios</button>
        </div>
      </div>
    </div>

    <!-- ─── center: results ─── -->
    <div class="col-6">
      <div id="load" class="text-center py-5 text-secondary">
        <span>click Run to start simulation</span>
      </div>
      <div id="cnt" style="display:none">

        <div class="card mb-2">
          <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="mb-1" id="res-title">—</h5>
                <div class="text-secondary small" id="res-path"></div>
              </div>
              <div id="res-verdict"></div>
            </div>
            <div id="res-path-vis" class="mt-2"></div>
          </div>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-4">
            <div class="card"><div class="card-body p-3 text-center">
              <div class="small text-secondary">PPV</div>
              <div class="h4 mb-0" id="r-ppv">—</div>
              <div class="small text-secondary" id="r-ppv-detail"></div>
            </div></div>
          </div>
          <div class="col-4">
            <div class="card"><div class="card-body p-3 text-center">
              <div class="small text-secondary">OPCV</div>
              <div class="h4 mb-0" id="r-opcv">—</div>
              <div class="small text-secondary" id="r-opcv-detail"></div>
            </div></div>
          </div>
          <div class="col-4">
            <div class="card"><div class="card-body p-3 text-center">
              <div class="small text-secondary">PFA</div>
              <div class="h4 mb-0" id="r-pfa">—</div>
              <div class="small text-secondary" id="r-pfa-detail"></div>
            </div></div>
          </div>
        </div>

        <div class="card mb-2">
          <div class="card-body p-3">
            <div class="small text-uppercase text-secondary mb-2" style="font-size:11px;">Metrics</div>
            <div class="row small g-2" id="res-metrics"></div>
          </div>
        </div>

        <div class="card mb-2">
          <div class="card-body p-3">
            <div class="small text-uppercase text-secondary mb-2" style="font-size:11px;">Hop trace</div>
            <table class="table table-sm table-bordered mb-0" style="font-size:13px;">
              <thead class="table-light"><tr><th>#</th><th>Node</th><th>Status</th></tr></thead>
              <tbody id="res-trace"></tbody>
            </table>
          </div>
        </div>

        <div class="card mb-2">
          <div class="card-body p-3">
            <div class="small text-uppercase text-secondary mb-2" style="font-size:11px;">Alerts</div>
            <div id="res-alerts"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- ─── right: log ─── -->
    <div class="col-3">
      <div class="card">
        <div class="card-header bg-white p-2">
          <span class="small text-uppercase text-secondary" style="font-size:11px;">Event log</span>
        </div>
        <div class="card-body p-2 log-pane" id="log-pane">
          <div class="entry text-secondary">ready</div>
        </div>
      </div>

      <div class="card mt-2">
        <div class="card-header bg-white p-2">
          <span class="small text-uppercase text-secondary" style="font-size:11px;">Packet trace</span>
        </div>
        <div class="card-body p-2" id="packet-log">
          <div class="text-secondary small">(run a sim to see packets)</div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="modal fade" id="bulk-modal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Bulk Results</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="bulk-body">loading...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let resultCache = null;
let bulkModal = null;

function log(msg, cls = '') {
  const p = document.getElementById('log-pane');
  const d = document.createElement('div');
  d.className = 'entry' + (cls ? ' ' + cls : '');
  const t = new Date().toLocaleTimeString();
  d.textContent = t + '  ' + msg;
  p.insertBefore(d, p.firstChild);
  while (p.children.length > 200) p.removeChild(p.lastChild);
  fetch('/api/action', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: msg, params: ''}),
  }).catch(() => {});
}

function pktLog(msg, cls = '') {
  const p = document.getElementById('packet-log');
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  p.insertBefore(d, p.firstChild);
  while (p.children.length > 100) p.removeChild(p.lastChild);
}

async function updateTopoInfo() {
  const v = document.getElementById('topo-select').value;
  try {
    const r = await fetch('/api/topologies');
    const data = await r.json();
    const t = data[v];
    document.getElementById('topo-info').innerHTML = `
      ${t.nodes} nodes, ${t.links} links<br>
      Names: ${Object.values(t.names).join(', ')}
    `;
  } catch(e) {}
}
updateTopoInfo();

async function runSim() {
  const topo = document.getElementById('topo-select').value;
  const attack = document.getElementById('attack-select').value;
  const mal = parseInt(document.getElementById('mal-node').value);
  const n = parseInt(document.getElementById('pkt-count').value);
  const btn = document.querySelector('.btn-dark');
  btn.disabled = true;
  btn.textContent = 'Running...';

  document.getElementById('load').style.display = 'none';
  document.getElementById('cnt').style.display = 'block';
  document.getElementById('res-title').textContent = 'Running...';
  document.getElementById('status-badge').textContent = 'running';

  log(`run  topo=${topo} attack=${attack} node=${mal} packets=${n}`);
  pktLog(`--- simulation start (${n} packets) ---`, '');

  // build attack config
  let attacks = [];
  if (attack !== 'none') {
    const ap = { name: attack, description: '', malicious_ids: [mal], inject_packets: [], drop_seqs: [], override_path: null };
    if (attack === 'injection') {
      ap.inject_packets = [{seq: n + 100, src: mal, dst: 5, record_at_dst: true}];
    }
    if (attack === 'drop') {
      ap.drop_seqs = [10, 20, 30, 40, 50];
    }
    if (attack === 'mitm') {
      ap.override_path = [1, 2, 5];
    }
    attacks = [ap];
  }

  try {
    const url = `/api/run?topology=${topo}&packets=${n}&attacks=${encodeURIComponent(JSON.stringify(attacks))}`;
    const r = await fetch(url);
    const data = await r.json();
    resultCache = data;
    renderResult(data);
    document.getElementById('status-badge').textContent = 'done';
    log(`result  ppv=${data.ppv.passed}  opcv=${data.opcv.passed}  total_ms=${data.timing.total_ms.toFixed(1)}`);
  } catch(e) {
    document.getElementById('res-title').textContent = 'Error';
    log('error: ' + e.message, 'text-danger');
  }
  btn.disabled = false;
  btn.textContent = 'Run';
}

function renderResult(data) {
  document.getElementById('res-title').textContent =
    `Path: ${data.path_names.join(' → ')}`;

  const mal = data.malicious_nodes;
  document.getElementById('res-path').textContent =
    mal.length > 0 ? `Malicious: ${mal.join(', ')}` : 'All nodes honest';

  const ok = data.ppv.passed && data.opcv.passed;
  document.getElementById('res-verdict').innerHTML =
    `<span class="badge ${ok ? 'bg-success' : 'bg-danger'} fs-6">${ok ? 'SECURE' : 'ATTACK DETECTED'}</span>`;

  // path visualization
  document.getElementById('res-path-vis').innerHTML =
    data.path_names.map((n, i) => {
      const bad = data.hop_trace[i] && data.hop_trace[i].is_malicious;
      const arr = i < data.path_names.length - 1 ? ' <span class="text-secondary">→</span> ' : '';
      return `<span class="badge ${bad ? 'bg-danger' : 'bg-secondary'} node-badge">${n}</span>${arr}`;
    }).join('');

  // PPV
  const ppvEl = document.getElementById('r-ppv');
  ppvEl.textContent = data.ppv.passed ? 'PASS' : 'BLOCK';
  ppvEl.className = 'h4 mb-0 text-' + (data.ppv.passed ? 'success' : 'danger');
  document.getElementById('r-ppv-detail').textContent = data.ppv.detail || 'ok';

  const opEl = document.getElementById('r-opcv');
  opEl.textContent = data.opcv.passed ? 'PASS' : 'ALERT';
  opEl.className = 'h4 mb-0 text-' + (data.opcv.passed ? 'success' : 'warning');
  document.getElementById('r-opcv-detail').textContent = data.opcv.detail || 'ok';

  const pfEl = document.getElementById('r-pfa');
  pfEl.textContent = data.pfa.passed ? 'PASS' : 'FAIL';
  pfEl.className = 'h4 mb-0 text-' + (data.pfa.passed ? 'success' : 'danger');
  document.getElementById('r-pfa-detail').textContent = data.pfa.detail || 'ok';

  // metrics
  const m = data.metrics;
  document.getElementById('res-metrics').innerHTML = `
    <div class="col-4"><span class="text-secondary">Detection latency</span><br>${m.detection_latency_ms} ms</div>
    <div class="col-4"><span class="text-secondary">Probe time</span><br>${m.probe_time_ms} ms</div>
    <div class="col-4"><span class="text-secondary">Sketch overhead</span><br>${m.verification_overhead_us} μs</div>
    <div class="col-4"><span class="text-secondary">Packets sent</span><br>${m.packets_sent}</div>
    <div class="col-4"><span class="text-secondary">Received</span><br>${m.packets_received}</div>
    <div class="col-4"><span class="text-secondary">Injected / dropped</span><br>${m.packets_injected} / ${m.packets_dropped}</div>
    <div class="col-4"><span class="text-secondary">Tag chain valid</span><br>${m.tag_chain_valid}</div>
    <div class="col-4"><span class="text-secondary">Sketch dev</span><br>${m.sketch_deviation}</div>
    <div class="col-4"><span class="text-secondary">Alerts</span><br>${m.alerts_triggered}</div>
  `;

  // trace
  document.getElementById('res-trace').innerHTML = data.hop_trace.map((h, i) =>
    `<tr><td class="text-secondary">${i+1}</td><td>${h.node_name} #${h.node_id}</td><td>${h.is_malicious ? '<span class="badge bg-danger">malicious</span>' : '<span class="badge bg-success">honest</span>'}</td></tr>`
  ).join('');

  // alerts
  document.getElementById('res-alerts').innerHTML = data.alerts.map(a => {
    const cls = a.success ? 'bg-white border' : 'bg-danger-subtle border-danger';
    return `<div class="p-2 mb-1 ${cls} d-flex align-items-center gap-2" style="font-size:13px;">
      <span class="small text-uppercase text-secondary" style="min-width:36px;">${a.source}</span>
      <span class="fw-semibold">${a.success ? 'PASS' : 'FAIL'}</span>
      <span class="text-secondary">${a.detail || '—'}</span>
      <span class="ms-auto"><span class="badge ${a.action === 'allow' ? 'bg-success' : a.action === 'quarantine' ? 'bg-danger' : 'bg-warning text-dark'}">${a.action}</span></span>
    </div>`;
  }).join('');

  // packet log
  pktLog(`verdict: ${ok ? 'SECURE' : 'ATTACK'}  latency=${m.detection_latency_ms}ms`, ok ? 'pkt-ok' : 'pkt-drop');
  if (m.packets_injected > 0) pktLog(`injected ${m.packets_injected} packets`, 'pkt-inject');
  if (m.packets_dropped > 0) pktLog(`dropped ${m.packets_dropped} packets`, 'pkt-drop');
  pktLog(`total: ${m.packets_sent} sent, ${m.packets_received} received`, '');
}

async function runBulk() {
  log('bulk simulation started');
  document.getElementById('status-badge').textContent = 'bulk running...';
  try {
    const r = await fetch('/api/bulk?topology=' + document.getElementById('topo-select').value);
    const data = await r.json();
    document.getElementById('status-badge').textContent = 'bulk done';
    log(`bulk complete: ${data.count} scenarios`);

    if (!bulkModal) bulkModal = new bootstrap.Modal('#bulk-modal');
    document.getElementById('bulk-body').innerHTML = renderBulkTable(data.results);
    bulkModal.show();
  } catch(e) {
    log('bulk error: ' + e.message, 'text-danger');
  }
}

function renderBulkTable(results) {
  let html = '<table class="table table-sm table-bordered"><thead class="table-light"><tr><th>Scen.</th><th>Pkts</th><th>PPV</th><th>OPCV</th><th>Latency</th><th>Overhead</th><th>Sent</th><th>Recv</th><th>Alerts</th></tr></thead><tbody>';
  for (const r of results) {
    const ppvCls = r.ppv ? 'text-success' : 'text-danger';
    const opvCls = r.opcv ? 'text-success' : 'text-warning';
    html += `<tr>
      <td>${r.label}</td>
      <td>${r.packets}</td>
      <td class="${ppvCls} fw-semibold">${r.ppv ? 'PASS' : 'BLOCK'}</td>
      <td class="${opvCls} fw-semibold">${r.opcv ? 'PASS' : 'ALERT'}</td>
      <td>${r.metrics.detection_latency_ms}ms</td>
      <td>${r.metrics.verification_overhead_us}μs</td>
      <td>${r.metrics.packets_sent}</td>
      <td>${r.metrics.packets_received}</td>
      <td>${r.metrics.alerts_triggered}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}
</script>
</body>
</html>
